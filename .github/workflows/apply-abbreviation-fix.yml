name: Apply abbreviation parsing fix

on:
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-abbreviation-initials
          fetch-depth: 0

      - name: Apply patch
        run: python3 tools/apply-abbreviation-fix.py

      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Sentence.php tests/SentenceTest.php .github/workflows/apply-abbreviation-fix.yml tools/apply-abbreviation-fix.py
          git commit -m "Handle lowercase dotted abbreviations"
          git push origin HEAD:agent/fix-abbreviation-initials
