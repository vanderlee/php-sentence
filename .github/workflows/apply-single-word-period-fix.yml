name: Apply single-word period sentence fix

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/single-word-period-sentences
          fetch-depth: 0

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring
          coverage: none

      - name: Apply exact source patch
        run: python3 tools/apply-single-word-period-fix.py

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Sentence.php tests/SentenceTest.php README.md .github/workflows/apply-single-word-period-fix.yml tools/apply-single-word-period-fix.py
          git commit -m "Recognize single-word period sentences"
          git push origin HEAD:agent/single-word-period-sentences
