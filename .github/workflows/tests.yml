name: Tests

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '5.4'
            composer: '2.2'
          - php: '5.6'
            composer: '2.2'
          - php: '7.4'
            composer: 'v2'
          - php: '8.0'
            composer: 'v2'
          - php: '8.4'
            composer: 'v2'
          - php: '8.5'
            composer: 'v2'
          - php: '8.6'
            composer: 'v2'

    name: PHP ${{ matrix.php }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, ctype
          tools: composer:${{ matrix.composer }}
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: composer test
