name: Apply PHPUnit fixture compatibility

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modernize-test-matrix
          fetch-depth: 0

      - name: Apply compatibility patch
        run: python3 tools/apply-phpunit-fixture-compat.py

      - name: Commit patched fixture and restored workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/SentenceTest.php .github/workflows/tests.yml tools/apply-phpunit-fixture-compat.py
          git commit -m "Make PHPUnit fixture setup cross-version compatible"
          git push origin HEAD:agent/modernize-test-matrix
